services:
  nginx:
    build: ./requirements/nginx/
    container_name: nginx
    image: inception-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - wordpress_vol:/var/www/html:ro
    env_file:
      - .env
    depends_on:
      wordpress:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    networks:
      - inception



  wordpress:
    build: ./requirements/wordpress/
    container_name: wordpress
    image: inception-wordpress
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
    volumes:
      - wordpress_vol:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]      
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s


  mariadb:
    build: ./requirements/mariadb/
    container_name: mariadb
    image: inception-mariadb
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_vol:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      device: ${HOST_DATA_PATH}/wordpress
      o: bind
  
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      device: ${HOST_DATA_PATH}/mariadb
      o: bind
  

networks:
  inception:
    name: inception
    driver: bridge


secrets:
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt